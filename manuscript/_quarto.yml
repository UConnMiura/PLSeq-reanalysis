project:
  type: manuscript
  output-dir: _output

manuscript:
  article: manuscript.qmd

format:
  html:
    toc: true
    number-sections: true
    format-links: false
  docx: default
  pdf:
    documentclass: article
    keep-tex: true
    include-in-header:
      - reader-preamble.tex

execute:
  echo: false
  warning: false
  freeze: auto

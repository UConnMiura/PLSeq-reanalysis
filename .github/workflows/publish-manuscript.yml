name: Publish manuscript

on:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "figures/main/**"
      - "figures/supplementary/**"
      - "supplementary_tables/**"
      - ".github/workflows/publish-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render manuscript website
        run: quarto render manuscript --to html
      - name: Add full-resolution figure files
        run: |
          mkdir -p manuscript/_output/figures
          cp figures/main/*.png manuscript/_output/figures/
          cp figures/main/*.pdf manuscript/_output/figures/
          cp figures/supplementary/*.pdf manuscript/_output/figures/
          mkdir -p manuscript/_output/supplementary_tables
          cp supplementary_tables/*.tsv manuscript/_output/supplementary_tables/
          cp supplementary_tables/README.md manuscript/_output/supplementary_tables/
          sed -i 's|../figures/main/|figures/|g' manuscript/_output/index.html
          sed -i 's|../figures/supplementary/|figures/|g' manuscript/_output/index.html
          sed -i 's|../supplementary_tables/|supplementary_tables/|g' manuscript/_output/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: manuscript/_output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
